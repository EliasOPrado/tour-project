name: Django CI and Deploy

on:
  push:
    branches:
      - main
      - master
      - develop
      - github-actions-configuration

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t django-test .

      - name: Run Django tests
        run: docker run --rm -e SECRET_KEY=ci-test-secret django-test python manage.py test --verbosity=2

  deploy:
    name: Publish image and deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          docker build \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            --tag "$IMAGE_NAME:latest" \
            .
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: Copy Compose file and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH_PORT="${VPS_SSH_PORT:-22}"
          DEPLOY_DIR="/srv/tour-project"
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts"

          test -n "$VPS_HOST" || { echo "Missing secret: VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing secret: VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing secret: VPS_SSH_KEY"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing secret: VPS_KNOWN_HOSTS"; exit 1; }

          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE" "$KNOWN_HOSTS_FILE"

          SSH_ARGS=(-i "$KEY_FILE" -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          scp -i "$KEY_FILE" -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            docker-compose.yml "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/docker-compose.yml"

          printf '%s' "$GHCR_TOKEN" | ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" \
            "set -e; docker login ghcr.io --username '$GHCR_USER' --password-stdin; trap 'docker logout ghcr.io >/dev/null 2>&1 || true' 0; cd '$DEPLOY_DIR'; mkdir -p data media; touch data/db.sqlite3; docker compose pull; docker compose up -d --remove-orphans"
